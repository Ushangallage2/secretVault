[package]
name = "secret-vault"
version = "0.1.0"
description = "Encrypted local vault for secrets, commands, and notes"
authors = ["Ushan Gallage"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "secret_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
parking_lot = "0.12"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
regex = "1"
# apple-native is required on macOS — without it keyring v3 uses an in-memory mock
# store, so "stay signed in" appears to work until the next app launch.
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
